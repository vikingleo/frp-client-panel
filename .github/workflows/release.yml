name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-latest
            sidecar_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macOS Intel
            runner: macos-15-intel
            sidecar_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: Linux x86_64
            runner: ubuntu-24.04
            sidecar_target: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage
          - platform: Windows x86_64
            runner: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go for sidecar build
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        shell: bash
        run: pnpm sync:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify target sidecar
        shell: bash
        run: pnpm verify:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: frp-panel Client ${{ inputs.release_tag || github.ref_name }}
          releaseBody: |
            Cross-platform desktop and tray client for frp-panel.

            Download the installer matching your system:
            - macOS Apple Silicon: DMG (aarch64-apple-darwin)
            - macOS Intel: DMG (x86_64-apple-darwin)
            - Linux x86_64: AppImage
            - Windows x86_64: NSIS EXE installer
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Verify release bundle artifact
        shell: bash
        run: pnpm verify:bundle
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}
