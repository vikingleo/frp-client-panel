name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-latest
            sidecar_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macOS Intel
            runner: macos-15-intel
            sidecar_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app,dmg
          - platform: Linux x86_64
            runner: ubuntu-24.04
            sidecar_target: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage
          - platform: Windows x86_64
            runner: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Setup Go for sidecar build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        shell: bash
        run: pnpm sync:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify target sidecar
        shell: bash
        run: pnpm verify:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build verified official frpc sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm sync:frpc
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify official frpc sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm verify:frpc
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: frp-panel Client ${{ inputs.release_tag || github.ref_name }}
          releaseBody: |
            Cross-platform desktop and tray client for frp-panel.

            Download the installer matching your system:
            - macOS Apple Silicon: DMG (aarch64-apple-darwin)
            - macOS Intel: DMG (x86_64-apple-darwin)
            - Linux x86_64: AppImage
            - Windows x86_64: NSIS EXE installer
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Verify release bundle artifact
        shell: bash
        run: pnpm verify:bundle
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Generate SHA256 checksums
        shell: bash
        run: pnpm checksums
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}
          CHECKSUM_OUTPUT: ${{ runner.temp }}/SHA256SUMS-${{ matrix.sidecar_target }}.txt

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: src-tauri/target
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-${{ matrix.sidecar_target }}.spdx.json
          artifact-name: sbom-${{ matrix.sidecar_target }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload checksum and SBOM to draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          CHECKSUM_OUTPUT: ${{ runner.temp }}/SHA256SUMS-${{ matrix.sidecar_target }}.txt
          SBOM_OUTPUT: ${{ runner.temp }}/sbom-${{ matrix.sidecar_target }}.spdx.json
        run: gh release upload "$RELEASE_TAG" "$CHECKSUM_OUTPUT" "$SBOM_OUTPUT" --clobber

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.exe

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-frp-panel-client-${{ matrix.sidecar_target }}
          path: |
            src-tauri/target/**/release/bundle/**
            ${{ runner.temp }}/SHA256SUMS-${{ matrix.sidecar_target }}.txt
            ${{ runner.temp }}/sbom-${{ matrix.sidecar_target }}.spdx.json
          if-no-files-found: error
          retention-days: 30
