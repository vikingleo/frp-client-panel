name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-bundle:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-latest
            sidecar_target: aarch64-apple-darwin
            bundle: app,dmg
          - platform: macOS Intel
            runner: macos-15-intel
            sidecar_target: x86_64-apple-darwin
            bundle: app,dmg
          - platform: Linux x86_64
            runner: ubuntu-24.04
            sidecar_target: x86_64-unknown-linux-gnu
            bundle: appimage
          - platform: Windows x86_64
            runner: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go for sidecar build
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        shell: bash
        run: pnpm sync:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify target sidecar
        shell: bash
        run: pnpm verify:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native installer
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Verify native bundle artifact
        shell: bash
        run: pnpm verify:bundle
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}
