name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-bundle:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-latest
            sidecar_target: aarch64-apple-darwin
            bundle: app,dmg
          - platform: macOS Intel
            runner: macos-15-intel
            sidecar_target: x86_64-apple-darwin
            bundle: app,dmg
          - platform: Linux x86_64
            runner: ubuntu-24.04
            sidecar_target: x86_64-unknown-linux-gnu
            bundle: appimage
          - platform: Windows x86_64
            runner: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Setup Go for sidecar build
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        shell: bash
        run: pnpm sync:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify target sidecar
        shell: bash
        run: pnpm verify:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native installer
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Verify native bundle artifact
        shell: bash
        run: pnpm verify:bundle
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frp-panel-client-${{ matrix.sidecar_target }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 14
