name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-bundle:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            runner: macos-latest
            sidecar_target: aarch64-apple-darwin
            bundle: app,dmg
          - platform: macOS Intel
            runner: macos-15-intel
            sidecar_target: x86_64-apple-darwin
            bundle: app,dmg
          - platform: Linux x86_64
            runner: ubuntu-24.04
            sidecar_target: x86_64-unknown-linux-gnu
            bundle: appimage
          - platform: Windows x86_64
            runner: windows-latest
            sidecar_target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Setup Go for sidecar build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        shell: bash
        run: pnpm sync:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Verify target sidecar
        shell: bash
        run: pnpm verify:client
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native installer
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Verify native bundle artifact
        shell: bash
        run: pnpm verify:bundle
        env:
          FRP_PANEL_TARGET_TRIPLE: ${{ matrix.sidecar_target }}

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frp-panel-client-${{ matrix.sidecar_target }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 14
