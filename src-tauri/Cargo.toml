[package]
name = "frp-panel-desktop-client"
version = "0.1.0"
description = "Cross-platform desktop and tray client for frp-panel"
authors = ["frp-panel Client"]
edition = "2021"

[lib]
name = "frp_panel_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.1.6"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "time", "sync", "rt-multi-thread"] }
