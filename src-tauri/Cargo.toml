[package]
name = "frp-panel-desktop-client"
version = "0.1.0"
description = "Cross-platform desktop and tray client for frp-panel"
authors = ["vikingleo and contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/vikingleo/frp-client-panel"
homepage = "https://github.com/vikingleo/frp-client-panel"
keywords = ["frp", "frp-panel", "tauri", "desktop", "tray"]
categories = ["network-programming", "gui"]
edition = "2021"

[lib]
name = "frp_panel_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
keyring = "4.1.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "time", "sync", "rt-multi-thread"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.0"
